<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e0e0c">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Opeth Rules">
  <meta property="og:title" content="Opeth Rules · Gracias por tu compra">
  <meta property="og:description" content="Confirmación de pedido.">
  <meta property="og:url" content="https://josv-sys.github.io/GA4-Test/gracias.html">
  <meta property="og:image" content="https://josv-sys.github.io/GA4-Test/assets/img/og.jpg">
  <meta property="og:image:width" content="728">
  <meta property="og:image:height" content="410">
  <meta name="twitter:card" content="summary_large_image">
  <title>Opeth Rules · Gracias por tu compra</title>
  <meta name="description" content="Confirmación de pedido.">
  <script src="js/analytics.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="carrito">
  <div id="site-nav"></div>

  <main class="container py-5" id="root"></main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script>
    const root = document.getElementById('root');
    let order = null;
    try { order = JSON.parse(OR.storage.get('sessionStorage', 'or_last_order')); } catch (e) { /* sin pedido */ }

    if (!order) {
      root.innerHTML = `<div class="text-center py-5"><h1 class="h3">No hay un pedido reciente</h1>
        <a href="tienda.html" class="btn btn-or mt-3">Ir a la tienda</a></div>`;
    } else {
      // Evitar purchase duplicado si recargan la página
      if (!order.tracked) {
        const p = { transaction_id: order.transaction_id, currency: order.currency, value: order.value,
          tax: order.tax, shipping: order.shipping, items: order.items };
        if (order.coupon) p.coupon = order.coupon;
        OR.track('purchase', p);
        order.tracked = true;
        OR.storage.set('sessionStorage', 'or_last_order', JSON.stringify(order));
      }

      root.innerHTML = `
        <div class="text-center mb-5">
          <i class="bi bi-check2-circle text-or" style="font-size: 4rem;"></i>
          <h1 class="display-6 mt-3">Gracias por tu compra</h1>
          <p class="text-muted-or">Pedido <code class="text-or">${OR.esc(order.transaction_id)}</code> · simulado, no se cobró nada.</p>
        </div>
        <div class="row justify-content-center"><div class="col-lg-6"><div class="card-or p-4">
          ${order.items.map(i => `<div class="d-flex justify-content-between small mb-2"><span>${i.quantity}× ${OR.esc(i.item_name)} <span class="text-muted-or">(${i.item_variant})</span></span><span>${OR.money(i.price * i.quantity)}</span></div>`).join('')}
          <hr class="border-or">
          <div class="d-flex justify-content-between small"><span class="text-muted-or">IVA</span><span>${OR.money(order.tax)}</span></div>
          <div class="d-flex justify-content-between small"><span class="text-muted-or">Envío (${OR.esc(order.shipping_tier)})</span><span>${OR.money(order.shipping)}</span></div>
          <div class="d-flex justify-content-between mt-2"><span>Total</span><span class="price">${OR.money(order.total)}</span></div>
        </div>
        <div class="text-center mt-4 d-flex justify-content-center gap-2 flex-wrap">
          <a href="tienda.html" class="btn btn-or">Seguir comprando</a>
          <button class="btn btn-outline-or" id="refund">Simular reembolso</button>
        </div></div></div>`;

      document.getElementById('refund').addEventListener('click', e => {
        OR.track('refund', { transaction_id: order.transaction_id, currency: order.currency, value: order.value, items: order.items });
        e.currentTarget.disabled = true;
        e.currentTarget.textContent = 'Reembolso enviado';
      });
    }
  </script>
</body>
</html>
