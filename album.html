<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opeth Rules · Álbum</title>
  <meta name="description" content="Detalle de álbum de Opeth.">
  <script src="js/analytics.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="tienda">
  <div id="site-nav"></div>

  <main class="container py-5" id="album-root"></main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script>
    const root = document.getElementById('album-root');
    const album = OR.findAlbum(new URLSearchParams(location.search).get('id'));

    if (!album) {
      root.innerHTML = `<div class="text-center py-5">
        <h1 class="h3">Este álbum se perdió en la niebla</h1>
        <p class="text-muted-or">No encontramos ese título.</p>
        <a href="tienda.html" class="btn btn-or">Volver a la tienda</a></div>`;
    } else {
      document.title = `Opeth Rules · ${album.title}`;
      const related = OR.albums.filter(a => a.era === album.era && a.id !== album.id).slice(0, 4);

      root.innerHTML = `
        <nav aria-label="breadcrumb"><ol class="breadcrumb small">
          <li class="breadcrumb-item"><a href="tienda.html" class="link-or">Tienda</a></li>
          <li class="breadcrumb-item active" aria-current="page">${OR.esc(album.title)}</li>
        </ol></nav>

        <div class="row g-5 align-items-start">
          <div class="col-md-5">${OR.coverHTML(album, 'cover-lg')}</div>
          <div class="col-md-7">
            <span class="era-pill">${OR.ERA_LABEL[album.era]}</span>
            <h1 class="display-6 mt-3 mb-1">${OR.esc(album.title)}</h1>
            <p class="text-muted-or">${album.year} · ${OR.esc(album.label)}</p>
            <p class="lead fs-6">${OR.esc(album.desc)}</p>

            <h2 class="h6 footer-title mt-4">Canciones destacadas</h2>
            <ul class="list-unstyled mb-4">${album.tracks.map(t => `<li class="py-1 border-bottom border-or"><i class="bi bi-music-note me-2 text-or"></i>${OR.esc(t)}</li>`).join('')}</ul>

            <h2 class="h6 footer-title">Formato</h2>
            <div class="d-flex gap-2 mb-3" role="group" aria-label="Formato">
              ${OR.VARIANTS.map((v, i) => `
                <input type="radio" class="btn-check" name="variant" id="v-${i}" value="${v}" ${i === 0 ? 'checked' : ''}>
                <label class="btn btn-ghost-or" for="v-${i}"><i class="bi ${v === 'CD' ? 'bi-disc' : 'bi-vinyl'} me-1"></i>${v}</label>`).join('')}
            </div>

            <div class="d-flex flex-wrap align-items-center gap-3 mb-4">
              <span class="price fs-3" id="price"></span>
              <div class="input-group" style="width: 8.5rem;">
                <button class="btn btn-outline-or" type="button" id="qty-minus" aria-label="Menos">−</button>
                <input type="number" class="form-control text-center" id="qty" value="1" min="1" max="10" aria-label="Cantidad">
                <button class="btn btn-outline-or" type="button" id="qty-plus" aria-label="Más">+</button>
              </div>
            </div>

            <div class="d-flex flex-wrap gap-2">
              <button class="btn btn-or btn-lg" id="add"><i class="bi bi-bag-plus me-2"></i>Agregar al carrito</button>
              <button class="btn btn-outline-or btn-lg" id="wish"><i class="bi bi-heart me-2"></i>Lista de deseos</button>
            </div>
            <div class="mt-3 d-flex flex-wrap gap-3 small">
              <a href="https://open.spotify.com/search/${encodeURIComponent('Opeth ' + album.title)}" target="_blank" rel="noopener" class="link-or"><i class="bi bi-spotify me-1"></i>Escuchar en Spotify</a>
              <button class="btn btn-link link-or p-0 small" id="share"><i class="bi bi-share me-1"></i>Compartir</button>
            </div>
          </div>
        </div>

        <section class="mt-5 pt-4">
          <div class="divider-rune"><i class="bi bi-moon"></i></div>
          <h2 class="h4 mb-4">De la misma era</h2>
          <div class="row g-4">${related.map((a, i) => `
            <div class="col-6 col-lg-3">
              <a href="album.html?id=${a.id}" class="text-decoration-none text-reset related" data-index="${i}">
                <div class="card-or card-lift p-3 h-100">${OR.coverHTML(a)}
                  <div class="mt-2 fw-semibold">${OR.esc(a.title)}</div>
                  <div class="price small">${OR.money(a.price)}</div>
                </div>
              </a>
            </div>`).join('')}
          </div>
        </section>`;

      const variant = () => document.querySelector('input[name=variant]:checked').value;
      const qtyEl = document.getElementById('qty');
      const qty = () => Math.min(10, Math.max(1, parseInt(qtyEl.value, 10) || 1));
      const updatePrice = () => document.getElementById('price').textContent = OR.money(OR.priceFor(album, variant()));
      updatePrice();

      OR.track('view_item', { currency: OR.CURRENCY, value: album.price, items: [OR.toGA4Item(album)] });

      document.querySelectorAll('input[name=variant]').forEach(r => r.addEventListener('change', () => {
        updatePrice();
        OR.track('select_variant', { item_id: album.id, item_variant: variant() });
      }));
      document.getElementById('qty-minus').addEventListener('click', () => qtyEl.value = Math.max(1, qty() - 1));
      document.getElementById('qty-plus').addEventListener('click', () => qtyEl.value = Math.min(10, qty() + 1));

      document.getElementById('add').addEventListener('click', () => OR.addToCart(album, variant(), qty()));

      document.getElementById('wish').addEventListener('click', e => {
        const item = OR.toGA4Item(album, { variant: variant() });
        OR.track('add_to_wishlist', { currency: OR.CURRENCY, value: item.price, items: [item] });
        e.currentTarget.innerHTML = '<i class="bi bi-heart-fill me-2"></i>En tu lista';
        e.currentTarget.disabled = true;
      });

      document.getElementById('share').addEventListener('click', async () => {
        OR.track('share', { method: navigator.share ? 'web_share' : 'copiar_enlace', content_type: 'album', item_id: album.id });
        try {
          if (navigator.share) await navigator.share({ title: album.title, url: location.href });
          else { await navigator.clipboard.writeText(location.href); OR.toast('Enlace copiado.'); }
        } catch (err) { /* el usuario canceló */ }
      });

      const relList = { id: 'relacionados_' + album.id, name: 'Relacionados - ' + album.title };
      document.querySelectorAll('.related').forEach(el => el.addEventListener('click', () => {
        const i = +el.dataset.index;
        OR.track('select_item', { item_list_id: relList.id, item_list_name: relList.name,
          items: [OR.toGA4Item(related[i], { index: i, listId: relList.id, listName: relList.name })] });
      }));
    }
  </script>
</body>
</html>
