<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opeth Rules · Contacto</title>
  <meta name="description" content="Escríbenos.">
  <script src="js/analytics.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="contacto">
  <div id="site-nav"></div>

  <main>
    <header class="page-header">
      <div class="container">
        <p class="eyebrow mb-2">Contacto</p>
        <h1 class="display-5 mb-0">Escríbenos</h1>
      </div>
    </header>

    <section class="container py-5">
      <div class="row g-5">
        <div class="col-lg-7">
          <form class="card-or p-4 needs-validation" id="contact" novalidate>
            <div class="row g-3">
              <div class="col-md-6"><label class="form-label small" for="c-name">Nombre</label><input class="form-control" id="c-name" required></div>
              <div class="col-md-6"><label class="form-label small" for="c-email">Correo</label><input type="email" class="form-control" id="c-email" required></div>
              <div class="col-12"><label class="form-label small" for="c-reason">Motivo</label>
                <select class="form-select" id="c-reason" required>
                  <option value="">Elige…</option>
                  <option value="pedido">Un pedido</option>
                  <option value="mayoreo">Ventas al mayoreo</option>
                  <option value="colaboracion">Colaboración / prensa</option>
                  <option value="otro">Otro</option>
                </select></div>
              <div class="col-12"><label class="form-label small" for="c-msg">Mensaje</label><textarea class="form-control" id="c-msg" rows="5" required></textarea></div>
              <div class="col-12"><div class="form-check">
                <input class="form-check-input" type="checkbox" id="c-news"><label class="form-check-label small" for="c-news">Quiero recibir el newsletter</label>
              </div></div>
            </div>
            <button class="btn btn-or mt-4" type="submit"><i class="bi bi-send me-2"></i>Enviar mensaje</button>
          </form>
        </div>
        <div class="col-lg-5">
          <h2 class="h4 mb-3">Preguntas frecuentes</h2>
          <div class="accordion accordion-or" id="faq"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script>
    const faqs = [
      ['envios', '¿Hacen envíos internacionales?', 'Sí, en esta tienda simulada enviamos a cualquier rincón del mundo… en teoría.'],
      ['vinilo', '¿Los vinilos son de 180 g?', 'Todos los vinilos del catálogo son de 180 g y vienen con funda interior antiestática.'],
      ['cupones', '¿Hay cupones?', 'Prueba OPETH10 o DAMNATION20 en el carrito.'],
      ['oficial', '¿Es la tienda oficial de Opeth?', 'No. Es un sitio de fans para practicar Google Analytics 4. La tienda oficial está en opeth.com.']
    ];
    document.getElementById('faq').innerHTML = faqs.map(([id, q, a]) => `
      <div class="accordion-item">
        <h3 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#faq-${id}" aria-expanded="false" aria-controls="faq-${id}">${q}</button></h3>
        <div id="faq-${id}" class="accordion-collapse collapse" data-bs-parent="#faq" data-faq="${id}"><div class="accordion-body text-muted-or">${a}</div></div>
      </div>`).join('');
    document.querySelectorAll('[data-faq]').forEach(c => c.addEventListener('show.bs.collapse', () =>
      OR.track('select_content', { content_type: 'faq', content_id: c.dataset.faq })));

    // generate_lead: solo enviamos datos NO personales (nunca nombre ni correo)
    document.getElementById('contact').addEventListener('submit', e => {
      e.preventDefault();
      const f = e.target;
      if (!f.checkValidity()) { f.classList.add('was-validated'); return; }
      const reason = document.getElementById('c-reason').value;
      OR.track('generate_lead', { lead_source: 'formulario_contacto', lead_reason: reason, currency: OR.CURRENCY, value: reason === 'mayoreo' ? 50 : 0 });
      if (document.getElementById('c-news').checked) OR.track('sign_up', { method: 'newsletter', form_location: 'contacto' });
      f.innerHTML = `<div class="text-center py-4"><i class="bi bi-envelope-check fs-1 text-or"></i>
        <p class="mt-3 mb-0">Mensaje recibido. Te responderemos antes de que termine "Black Rose Immortal".</p></div>`;
    });
  </script>
</body>
</html>
