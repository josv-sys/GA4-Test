<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e0e0c">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Opeth Rules">
  <meta property="og:title" content="Opeth Rules · Videos">
  <meta property="og:description" content="Videos de Opeth.">
  <meta property="og:url" content="https://josv-sys.github.io/GA4-Test/videos.html">
  <meta property="og:image" content="https://josv-sys.github.io/GA4-Test/assets/img/og.jpg">
  <meta property="og:image:width" content="728">
  <meta property="og:image:height" content="410">
  <meta name="twitter:card" content="summary_large_image">
  <title>Opeth Rules · Videos</title>
  <meta name="description" content="Videos de Opeth.">
  <script src="js/analytics.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="videos">
  <div id="site-nav"></div>

  <main>
    <header class="page-header">
      <div class="container">
        <p class="eyebrow mb-2">Videos</p>
        <h1 class="display-5 mb-3">Imágenes en la niebla</h1>
        <p class="text-muted-or mb-0">Videoclips de todas sus eras. Haz clic en uno para reproducirlo.</p>
      </div>
    </header>

    <section class="container py-5">
      <div class="row g-4" id="videos"></div>
      <p class="small text-muted-or mt-4 mb-0"><i class="bi bi-info-circle me-1"></i>Los videos sin ID configurado abren una búsqueda en YouTube. Para incrustarlos, agrega el <code>youtubeId</code> en <code>js/data.js</code>.</p>
    </section>
  </main>

  <div class="modal fade" id="video-modal" tabindex="-1" aria-labelledby="video-title" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
      <div class="modal-content" style="background: var(--or-surface); border-color: var(--or-border);">
        <div class="modal-header border-or">
          <h2 class="modal-title h5" id="video-title"></h2>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body p-0">
          <div class="ratio ratio-16x9" id="video-frame"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script>
    const wrap = document.getElementById('videos');
    wrap.innerHTML = OR.videos.map((v, i) => {
      const a = OR.findAlbum(v.album);
      const thumb = v.youtubeId ? `<img src="https://img.youtube.com/vi/${v.youtubeId}/hqdefault.jpg" alt="" loading="lazy">` : '';
      const search = 'https://www.youtube.com/results?search_query=' + encodeURIComponent('Opeth ' + v.song + ' official video');
      return `
        <div class="col-sm-6 col-lg-4">
          <a href="${v.youtubeId ? '#' : search}" ${v.youtubeId ? '' : 'target="_blank" rel="noopener"'} class="video-card d-block text-decoration-none text-reset" data-i="${i}">
            <div class="video-thumb" style="--c1:${a.colors[0]};--c2:${a.colors[1]}">${thumb}<span class="play"><i class="bi bi-play-circle"></i></span></div>
            <div class="mt-2 d-flex justify-content-between align-items-start">
              <div><div class="fw-semibold">${OR.esc(v.song)}</div><div class="small text-muted-or">${OR.esc(a.title)} · ${a.year}</div></div>
              ${v.youtubeId ? '' : '<i class="bi bi-box-arrow-up-right small text-muted-or mt-1"></i>'}
            </div>
          </a>
        </div>`;
    }).join('');

    const modalEl = document.getElementById('video-modal');
    const modal = new bootstrap.Modal(modalEl);
    const frame = document.getElementById('video-frame');

    wrap.querySelectorAll('.video-card').forEach(card => card.addEventListener('click', e => {
      const v = OR.videos[+card.dataset.i];
      OR.track('video_open', { video_title: v.song, video_album: v.album, video_provider: 'youtube', open_mode: v.youtubeId ? 'modal' : 'youtube_externo' });
      if (!v.youtubeId) return; // sigue el enlace externo (también cuenta como clic saliente)
      e.preventDefault();
      document.getElementById('video-title').textContent = v.song;
      frame.innerHTML = `<iframe src="https://www.youtube.com/embed/${v.youtubeId}?enablejsapi=1&autoplay=1&rel=0" title="${OR.esc(v.song)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
      modal.show();
    }));
    modalEl.addEventListener('hidden.bs.modal', () => frame.innerHTML = '');
  </script>
</body>
</html>
